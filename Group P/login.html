<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="logo">
        <a href="#">
            <img src="Spotify_Logo-png-RGB-Green-1200x360.png" alt="logo"/>
        </a>
    </div>
    <div class="form">
        <form action="" method="get">
            <br>
            <br>
            <caption><h1>log In To spotify</h1></caption>
            <br>
            <br>
            <b><h4>Email Or Username:</h4></b>
            <input type="text" placeholder="email or Username" size="30px">
            <br>
            <br>
            <b><h4>Password</h4></b>
            <input type="password" placeholder="password" size="25px">
            <br>
            <br>
            <br>
            <a href="home page.html">
            <button type="button">Log In</button>
            </a>  
        </form>
    </div>
</body>
</html>
